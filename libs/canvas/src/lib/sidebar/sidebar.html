<aside class="sidebar">
  <div class="sidebar-header">
    <h1 class="sidebar-title">AWS Builder</h1>
    <p class="sidebar-subtitle">Drag or click a service to add it</p>
  </div>

  <div class="search-wrapper">
    <input
      type="text"
      class="search-input"
      placeholder="Search services..."
      [(ngModel)]="searchText"
    />
  </div>

  <div class="services-list">
    @for (category of categories; track category) {
    <div class="category-group">
      <h3 class="category-title">{{ category }}</h3>
      @for (service of filteredServices(category); track service.type) {
      <button
        type="button"
        class="service-item"
        draggable="true"
        (dragstart)="onDragStart($event, service)"
        (click)="addRequested.emit(service)"
      >
        <div class="service-icon" [style.background-color]="service.color">
          <svg viewBox="0 0 24 24" class="icon">
            <path [attr.d]="service.iconPath" fill="currentColor" />
          </svg>
        </div>
        <span class="service-label">{{ service.label }}</span>
      </button>
      }
    </div>
    }
  </div>

  <div class="sidebar-footer">
    <div class="zoom-controls">
      <button class="zoom-btn" (click)="zoomOut()">-</button>
      <span class="zoom-value">{{ zoomPercent }}%</span>
      <button class="zoom-btn" (click)="zoomIn()">+</button>
      <button class="zoom-btn fit" (click)="fitRequested.emit()">Fit</button>
    </div>
    <button class="delete-btn" (click)="deleteRequested.emit()">Delete</button>
  </div>
</aside>
