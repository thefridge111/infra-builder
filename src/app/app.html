<div class="app-layout">
  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title">{{ title }}</h1>
    </div>
    <div class="header-actions">
      <select class="btn examples" (change)="loadExample($event)">
        <option value="">Examples…</option>
        @for (example of examples; track example.name) {
        <option [value]="$index" [title]="example.description">
          {{ example.name }}
        </option>
        }
      </select>
      <div class="btn-group">
        <button
          class="btn"
          [disabled]="!state.canUndo()"
          (click)="state.undo()"
          title="Undo (⌘Z)"
        >
          Undo
        </button>
        <button
          class="btn"
          [disabled]="!state.canRedo()"
          (click)="state.redo()"
          title="Redo (⇧⌘Z)"
        >
          Redo
        </button>
      </div>
      <div class="btn-group">
        <button class="btn" (click)="exportPng()">PNG</button>
        <button class="btn" (click)="exportPdf()">PDF</button>
      </div>
      <div class="btn-group">
        <button class="btn" (click)="exportCloudFormationJson()">
          CF JSON
        </button>
        <button class="btn" (click)="exportCloudFormationYaml()">
          CF YAML
        </button>
        <button class="btn" (click)="previewCloudFormation()">Preview</button>
      </div>
      <div class="btn-group">
        <button class="btn" (click)="exportProject()">Save</button>
        <label class="btn file-label">
          Load
          <input
            type="file"
            accept=".json"
            (change)="importProject($event)"
            hidden
          />
        </label>
      </div>
    </div>
  </header>

  <main class="app-main">
    <lib-sidebar
      (deleteRequested)="canvas.deleteSelection()"
      (fitRequested)="canvas.fitToContent()"
      (addRequested)="canvas.addNode($event)"
    ></lib-sidebar>
    <lib-canvas
      [shortcutsEnabled]="!showCfPreview"
      (nodeActivated)="focusLabel()"
    ></lib-canvas>
    <lib-properties></lib-properties>
  </main>
</div>

@if (showCfPreview) {
<!-- eslint-disable @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<div
  class="modal-overlay"
  (click)="closeCfPreview()"
  role="dialog"
  aria-modal="true"
>
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>CloudFormation Template</h2>
      <button class="modal-close" (click)="closeCfPreview()">&times;</button>
    </div>
    <pre class="modal-body">{{ cfPreviewContent }}</pre>
    <div class="modal-footer">
      <button class="btn" (click)="exportCloudFormationJson()">
        Download JSON
      </button>
      <button class="btn" (click)="exportCloudFormationYaml()">
        Download YAML
      </button>
    </div>
  </div>
</div>
<!-- eslint-enable @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
}
